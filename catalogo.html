<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="page.catalog.title">Catálogo de telas — LedLink</title>
    <meta name="description" data-i18n-content="page.catalog.description" content="Telas de LED disponíveis para anunciar, com filtros por cidade, tipo e público." />
    <meta property="og:type" content="website" />
    <meta property="og:title" data-i18n-content="page.catalog.title" content="Catálogo — LedLink" />
    <meta property="og:description" data-i18n-content="page.catalog.description" content="" />
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Ir para o conteúdo</a>
    <header id="site-header"></header>

    <main id="main" class="page">
      <div class="container">
        <header class="page-head">
          <h1 data-i18n="catalog.title">Telas disponíveis</h1>
          <p class="lead" data-i18n="catalog.subtitle">
            Filtre por cidade, tipo e público para encontrar o painel certo.
          </p>
        </header>

        <p class="demo-banner" data-i18n="catalog.demo">
          Prévia: as telas abaixo são exemplos fictícios para demonstrar a plataforma.
        </p>

        <form class="filters" id="filters" role="search" novalidate>
          <div class="field field-search">
            <label for="q" data-i18n="catalog.searchLabel">Buscar</label>
            <input id="q" name="q" type="search" autocomplete="off" data-i18n-placeholder="catalog.searchPlaceholder" />
          </div>
          <div class="field">
            <label for="city" data-i18n="catalog.city">Cidade</label>
            <select id="city" name="city"></select>
          </div>
          <div class="field">
            <label for="type" data-i18n="catalog.type">Tipo</label>
            <select id="type" name="type"></select>
          </div>
          <div class="field">
            <label for="size" data-i18n="catalog.size">Tamanho</label>
            <select id="size" name="size"></select>
          </div>
          <div class="field">
            <label for="audience" data-i18n="catalog.audience">Público/dia</label>
            <select id="audience" name="audience"></select>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" id="clear" data-i18n="catalog.clear">
            Limpar
          </button>
        </form>

        <p class="results-count" id="results" aria-live="polite"></p>

        <div class="grid" id="grid"></div>

        <div class="empty" id="empty" hidden>
          <h3 data-i18n="catalog.emptyTitle">Nenhuma tela encontrada</h3>
          <p data-i18n="catalog.emptyText">Tente remover algum filtro ou buscar outra cidade.</p>
          <button class="btn btn-ghost btn-sm" type="button" id="clear-empty" data-i18n="catalog.clear">
            Limpar filtros
          </button>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="src/app/catalog.js"></script>
  </body>
</html>
